<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#fbbf24">

  <title>Virexo Market</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Cairo, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }


    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .header {
      max-width: 1200px;
      height: 70px;
      margin: auto;
      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 21px;
      font-weight: 900;
    }

    .logo-icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      background: linear-gradient(
        135deg,
        #ffd84d,
        #f59e0b
      );

      border-radius: 14px;

      font-size: 23px;
    }

    .logo span {
      color: #2563eb;
    }


    .sell-btn {
      border: none;

      background: linear-gradient(
        135deg,
        #fbbf24,
        #f59e0b
      );

      padding: 11px 17px;

      border-radius: 12px;

      font-weight: 900;
    }


    /* HERO */

    .hero {

      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(251,191,36,.25),
          transparent 30%
        ),

        radial-gradient(
          circle at 90% 10%,
          rgba(37,99,235,.20),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #111827,
          #1e293b
        );

      color: white;

      padding: 55px 18px 65px;

      text-align: center;
    }

    .hero h1 {
      font-size: clamp(
        30px,
        6vw,
        52px
      );

      font-weight: 900;

      margin-bottom: 12px;
    }

    .hero strong {
      color: #fbbf24;
    }

    .hero p {
      color: #d1d5db;

      margin-bottom: 28px;
    }


    /* SEARCH */

    .search {
      max-width: 760px;
      margin: auto;

      background: white;

      padding: 7px;

      border-radius: 17px;

      display: flex;

      gap: 7px;
    }

    .search input {

      flex: 1;

      border: none;

      outline: none;

      padding: 13px;

      font-size: 14px;

      color: #111827;
    }

    .search button {

      border: none;

      background: #2563eb;

      color: white;

      padding: 0 22px;

      border-radius: 12px;

      font-weight: 800;
    }


    /* MAIN */

    .container {

      max-width: 1200px;

      margin: auto;

      padding: 35px 18px 70px;
    }


    /* CATEGORIES */

    .categories {

      display: grid;

      grid-template-columns:
        repeat(8,1fr);

      gap: 10px;

      margin-bottom: 35px;
    }

    .category {

      background: white;

      border: 1px solid #e5e7eb;

      border-radius: 15px;

      padding: 15px 5px;

      text-align: center;

      transition: .2s;
    }

    .category:hover,
    .category.active {

      border-color: #fbbf24;

      transform:
        translateY(-3px);

    }

    .category-icon {

      font-size: 26px;

      margin-bottom: 5px;
    }

    .category strong {

      font-size: 12px;
    }


    /* TITLE */

    .title {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 15px;
    }

    .title h2 {

      font-size: 22px;

      font-weight: 900;
    }

    .count {

      color: #6b7280;

      font-size: 13px;
    }


    /* FILTER */

    .filters {

      display: flex;

      gap: 10px;

      margin-bottom: 20px;

      flex-wrap: wrap;
    }

    select {

      border: 1px solid #e5e7eb;

      background: white;

      padding: 10px 13px;

      border-radius: 11px;

      outline: none;
    }


    /* PRODUCTS */

    .products {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 17px;
    }

    .product {

      background: white;

      border-radius: 18px;

      overflow: hidden;

      border: 1px solid #e5e7eb;

      box-shadow:
        0 7px 22px
        rgba(0,0,0,.05);

      transition: .2s;
    }

    .product:hover {

      transform:
        translateY(-5px);

      box-shadow:
        0 15px 35px
        rgba(0,0,0,.10);
    }


    .image {

      height: 200px;

      background: #e5e7eb;

      display: grid;

      place-items: center;

      overflow: hidden;
    }

    .image img {

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .placeholder {

      font-size: 60px;
    }


    .product-body {

      padding: 14px;
    }

    .product-name {

      font-weight: 800;

      margin-bottom: 6px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .price {

      color: #2563eb;

      font-size: 18px;

      font-weight: 900;

      margin-bottom: 6px;
    }

    .location {

      color: #6b7280;

      font-size: 12px;

      margin-bottom: 12px;
    }

    .details {

      width: 100%;

      border: none;

      background: #eff6ff;

      color: #2563eb;

      padding: 9px;

      border-radius: 10px;

      font-weight: 800;
    }


    /* EMPTY */

    .empty {

      display: none;

      background: white;

      text-align: center;

      padding: 55px 20px;

      border-radius: 18px;

      border: 1px dashed #d1d5db;
    }

    .empty-icon {

      font-size: 50px;

      margin-bottom: 10px;
    }


    /* MODAL */

    .modal {

      position: fixed;

      inset: 0;

      background:
        rgba(15,23,42,.70);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 18px;

      z-index: 3000;
    }

    .modal.show {

      display: flex;
    }


    .modal-box {

      width:
        min(600px,100%);

      max-height: 92vh;

      overflow-y: auto;

      background: white;

      border-radius: 22px;
    }


    .modal-head {

      padding: 18px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom:
        1px solid #e5e7eb;
    }

    .modal-head h2 {

      font-size: 20px;
    }

    .close {

      width: 38px;
      height: 38px;

      border: none;

      background: #f3f4f6;

      border-radius: 10px;

      font-size: 20px;
    }


    .form {

      padding: 20px;
    }

    .group {

      margin-bottom: 14px;
    }

    label {

      display: block;

      font-size: 13px;

      font-weight: 800;

      margin-bottom: 6px;
    }

    .control {

      width: 100%;

      border: 1px solid #e5e7eb;

      background: #fafafa;

      padding: 12px;

      border-radius: 11px;

      outline: none;
    }

    textarea.control {

      min-height: 100px;

      resize: vertical;
    }


    .grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }


    .submit {

      width: 100%;

      border: none;

      padding: 14px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #fbbf24,
          #f59e0b
        );

      font-weight: 900;

      font-size: 15px;
    }


    /* TOAST */

    .toast {

      position: fixed;

      bottom: 25px;

      left: 50%;

      transform:
        translateX(-50%)
        translateY(100px);

      background: #111827;

      color: white;

      padding: 12px 18px;

      border-radius: 12px;

      opacity: 0;

      transition: .3s;

      z-index: 5000;
    }

    .toast.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* FOOTER */

    footer {

      background: #111827;

      color: white;

      text-align: center;

      padding: 35px 15px;
    }

    footer p {

      color: #9ca3af;

      font-size: 12px;

      margin-top: 5px;
    }


    /* MOBILE */

    @media(max-width:900px) {

      .products {

        grid-template-columns:
          repeat(3,1fr);
      }

      .categories {

        grid-template-columns:
          repeat(4,1fr);
      }
    }


    @media(max-width:600px) {

      .header {

        height: 64px;
      }

      .products {

        grid-template-columns:
          repeat(2,1fr);

        gap: 11px;
      }

      .categories {

        grid-template-columns:
          repeat(4,1fr);

        gap: 7px;
      }

      .category {

        padding: 11px 3px;
      }

      .category-icon {

        font-size: 21px;
      }

      .category strong {

        font-size: 10px;
      }

      .image {

        height: 160px;
      }

      .grid {

        grid-template-columns:
          1fr;
      }

      .hero {

        padding: 40px 15px 50px;
      }

      .search button {

        padding: 0 14px;
      }
    }

  </style>

</head>


<body>


<!-- HEADER -->

<header>

  <div class="header">

    <div class="logo">

      <div class="logo-icon">
        🛍️
      </div>

      <div>
        Virexo
        <span>Market</span>
      </div>

    </div>


    <button
      class="sell-btn"
      onclick="openSell()">

      ➕ بيع سلعة

    </button>

  </div>

</header>



<!-- HERO -->

<section class="hero">

  <h1>

    سوقك الإلكتروني
    <strong>في الجزائر 🇩🇿</strong>

  </h1>

  <p>

    بيع واشري بسهولة مع Virexo Market

  </p>


  <div class="search">

    <input
      id="search"
      type="search"
      placeholder="قلب على سيارة، هاتف، ملابس..."
      oninput="filterProducts()"
    >

    <button
      onclick="filterProducts()">

      🔎 بحث

    </button>

  </div>

</section>



<!-- MAIN -->

<main class="container">


  <!-- CATEGORIES -->

  <div class="categories">

    <button
      class="category active"
      onclick="setCategory('الكل',this)">

      <div class="category-icon">
        🏪
      </div>

      <strong>الكل</strong>

    </button>


    <button
      class="category"
      onclick="setCategory('سيارات',this)">

      <div class="category-icon">
        🚗
      </div>

      <strong>سيارات</strong>

    </button>


    <button
      class="category"
      onclick="setCategory('هواتف',this)">

      <div class="category-icon">
        📱
      </div>

      <strong>هواتف</strong>

    </button>


    <button
      class="category"
      onclick="setCategory('إلكترونيات',this)">

      <div class="category-icon">
        💻
      </div>

      <strong>إلكترونيات</strong>

    </button>


    <button
      class="category"
      onclick="setCategory('ملابس',this)">

      <div class="category-icon">
        👕
      </div>

      <strong>ملابس</strong>

    </button>


    <button
      class="category"
      onclick="setCategory('أثاث',this)">

      <div class="category-icon">
        🛋️
      </div>

      <strong>أثاث</strong>

    </button>


    <button
      class="category"
      onclick="setCategory('عقارات',this)">

      <div class="category-icon">
        🏠
      </div>

      <strong>عقارات</strong>

    </button>


    <button
      class="category"
      onclick="setCategory('أخرى',this)">

      <div class="category-icon">
        📦
      </div>

      <strong>أخرى</strong>

    </button>

  </div>



  <!-- TITLE -->

  <div class="title">

    <h2>
      🔥 أحدث الإعلانات
    </h2>

    <div
      id="count"
      class="count">
    </div>

  </div>



  <!-- FILTERS -->

  <div class="filters">

    <select
      id="wilaya"
      onchange="filterProducts()">

      <option value="">
        كل الولايات
      </option>

      <option>غليزان</option>
      <option>وهران</option>
      <option>الجزائر</option>
      <option>مستغانم</option>
      <option>معسكر</option>
      <option>الشلف</option>
      <option>تيارت</option>
      <option>تلمسان</option>
      <option>سيدي بلعباس</option>

    </select>


    <select
      id="sort"
      onchange="filterProducts()">

      <option value="new">
        الأحدث
      </option>

      <option value="low">
        الأرخص
      </option>

      <option value="high">
        الأغلى
      </option>

    </select>

  </div>



  <!-- PRODUCTS -->

  <div
    id="products"
    class="products">
  </div>


  <div
    id="empty"
    class="empty">

    <div class="empty-icon">
      🔍
    </div>

    <h3>
      لا توجد إعلانات
    </h3>

    <p>
      جرب البحث بكلمة أخرى.
    </p>

  </div>

</main>



<!-- SELL MODAL -->

<div
  id="sellModal"
  class="modal">

  <div class="modal-box">


    <div class="modal-head">

      <h2>
        ➕ أضف سلعتك
      </h2>

      <button
        class="close"
        onclick="closeSell()">

        ×

      </button>

    </div>


    <form
      id="sellForm"
      class="form">


      <div class="group">

        <label>
          اسم السلعة *
        </label>

        <input
          id="name"
          class="control"
          placeholder="مثال: iPhone 13"
          required
        >

      </div>



      <div class="grid">


        <div class="group">

          <label>
            السعر *
          </label>

          <input
            id="price"
            class="control"
            type="number"
            min="0"
            placeholder="85000"
            required
          >

        </div>


        <div class="group">

          <label>
            التصنيف *
          </label>

          <select
            id="category"
            class="control"
            required>

            <option value="">
              اختر
            </option>

            <option>سيارات</option>
            <option>هواتف</option>
            <option>إلكترونيات</option>
            <option>ملابس</option>
            <option>أثاث</option>
            <option>عقارات</option>
            <option>أخرى</option>

          </select>

        </div>

      </div>



      <div class="grid">


        <div class="group">

          <label>
            الولاية *
          </label>

          <select
            id="productWilaya"
            class="control"
            required>

            <option value="">
              اختر الولاية
            </option>

            <option>غليزان</option>
            <option>وهران</option>
            <option>الجزائر</option>
            <option>مستغانم</option>
            <option>معسكر</option>
            <option>الشلف</option>
            <option>تيارت</option>
            <option>تلمسان</option>
            <option>سيدي بلعباس</option>

          </select>

        </div>


        <div class="group">

          <label>
            البلدية
          </label>

          <input
            id="commune"
            class="control"
            placeholder="مثال: غليزان"
          >

        </div>

      </div>



      <div class="group">

        <label>
          اسم البائع *
        </label>

        <input
          id="seller"
          class="control"
          placeholder="اسمك"
          required
        >

      </div>



      <div class="group">

        <label>
          رقم الهاتف *
        </label>

        <input
          id="phone"
          class="control"
          type="tel"
          placeholder="0550000000"
          required
        >

      </div>



      <div class="group">

        <label>
          وصف السلعة
        </label>

        <textarea
          id="description"
          class="control"
          placeholder="اكتب تفاصيل السلعة...">
        </textarea>

      </div>



      <button
        class="submit"
        type="submit">

        🚀 نشر السلعة

      </button>

    </form>

  </div>

</div>



<!-- TOAST -->

<div
  id="toast"
  class="toast">
</div>



<footer>

  <strong>
    🛍️ Virexo Market
  </strong>

  <p>
    سوق إلكتروني جزائري مفتوح للجميع 🇩🇿
  </p>

  <p>
    V2.0
  </p>

</footer>



<script>


let allProducts = [];

let currentCategory = "الكل";



/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  try {

    const response =
      await fetch("/api/products");


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        "API Error"
      );

    }


    allProducts =
      data.products || [];


    filterProducts();


  } catch(error) {

    console.error(error);

    showToast(
      "❌ تعذر الاتصال بالسيرفر"
    );

  }

}



/* =========================
   RENDER
========================= */

function renderProducts(products) {

  const container =
    document.getElementById("products");

  const empty =
    document.getElementById("empty");

  const count =
    document.getElementById("count");


  container.innerHTML = "";


  count.textContent =
    products.length + " إعلان";


  if (!products.length) {

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  products.forEach(product => {


    const card =
      document.createElement("div");


    card.className =
      "product";


    card.innerHTML = `

      <div class="image">

        ${
          product.image

          ?

          `<img
             src="${product.image}"
             alt="${escapeHTML(product.name)}"
           >`

          :

          `<div class="placeholder">
             ${icon(product.category)}
           </div>`
        }

      </div>


      <div class="product-body">

        <div class="product-name">

          ${escapeHTML(product.name)}

        </div>


        <div class="price">

          ${formatPrice(product.price)}

        </div>


        <div class="location">

          📍 ${escapeHTML(product.wilaya)}

          ${
            product.commune
            ?
            " - " +
            escapeHTML(product.commune)
            :
            ""
          }

        </div>


        <button
          class="details"
          onclick="showProduct(${product.id})">

          👁️ عرض التفاصيل

        </button>

      </div>

    `;


    container.appendChild(card);

  });

}



/* =========================
   FILTER
========================= */

function filterProducts() {


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const wilaya =
    document
      .getElementById("wilaya")
      .value;


  const sort =
    document
      .getElementById("sort")
      .value;


  let result =
    allProducts.filter(product => {


      const text = `

        ${product.name}

        ${product.category}

        ${product.wilaya}

        ${product.commune}

        ${product.description}

      `.toLowerCase();


      return (

        (!search ||
          text.includes(search))

        &&

        (
          currentCategory === "الكل"
          ||
          product.category ===
          currentCategory
        )

        &&

        (
          !wilaya ||
          product.wilaya === wilaya
        )

      );

    });



  if(sort === "low") {

    result.sort(
      (a,b) =>
        Number(a.price) -
        Number(b.price)
    );

  }

  else if(sort === "high") {

    result.sort(
      (a,b) =>
        Number(b.price) -
        Number(a.price)
    );

  }

  else {

    result.sort(
      (a,b) =>
        Number(b.date) -
        Number(a.date)
    );

  }


  renderProducts(result);

}



/* =========================
   CATEGORY
========================= */

function setCategory(category, element) {

  currentCategory =
    category;


  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.classList
        .remove("active");

    });


  element.classList
    .add("active");


  filterProducts();

}



/* =========================
   ADD PRODUCT
========================= */

document
  .getElementById("sellForm")
  .addEventListener(
    "submit",
    async function(event) {


      event.preventDefault();


      const product = {

        name:
          document
            .getElementById("name")
            .value
            .trim(),

        price:
          Number(
            document
              .getElementById("price")
              .value
          ),

        category:
          document
            .getElementById("category")
            .value,

        wilaya:
          document
            .getElementById(
              "productWilaya"
            )
            .value,

        commune:
          document
            .getElementById(
              "commune"
            )
            .value
            .trim(),

        seller:
          document
            .getElementById(
              "seller"
            )
            .value
            .trim(),

        phone:
          document
            .getElementById(
              "phone"
            )
            .value
            .trim(),

        description:
          document
            .getElementById(
              "description"
            )
            .value
            .trim()

      };


      try {


        const response =
          await fetch(
            "/api/products",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(product)

            }
          );


        const data =
          await response.json();


        if(!response.ok) {

          throw new Error(
            data.message ||
            "حدث خطأ"
          );

        }


        showToast(
          "🎉 تم نشر السلعة بنجاح"
        );


        this.reset();


        closeSell();


        await loadProducts();


      }

      catch(error) {

        console.error(error);

        showToast(
          "❌ " + error.message
        );

      }

    }
  );



/* =========================
   PRODUCT DETAILS
========================= */

async function showProduct(id) {


  try {


    const response =
      await fetch(
        "/api/products/" + id
      );


    const data =
      await response.json();


    if(!response.ok) {

      throw new Error(
        data.message
      );

    }


    const product =
      data.product;


    alert(

      "🛍️ " +
      product.name +

      "\n\n" +

      "💰 السعر: " +
      formatPrice(product.price) +

      "\n\n" +

      "📍 المكان: " +
      product.wilaya +

      (
        product.commune
        ?
        " - " +
        product.commune
        :
        ""
      ) +

      "\n\n" +

      "👤 البائع: " +
      product.seller +

      "\n📞 الهاتف: " +
      product.phone +

      "\n\n" +

      (
        product.description ||
        "لا يوجد وصف"
      )

    );


  }

  catch(error) {

    showToast(
      "❌ " + error.message
    );

  }

}



/* =========================
   OPEN SELL
========================= */

function openSell() {

  document
    .getElementById("sellModal")
    .classList
    .add("show");

}



/* =========================
   CLOSE SELL
========================= */

function closeSell() {

  document
    .getElementById("sellModal")
    .classList
    .remove("show");

}



/* =========================
   ICON
========================= */

function icon(category) {

  const icons = {

    "سيارات": "🚗",

    "هواتف": "📱",

    "إلكترونيات": "💻",

    "ملابس": "👕",

    "أثاث": "🛋️",

    "عقارات": "🏠",

    "أخرى": "📦"

  };


  return icons[category] ||
         "🛍️";

}



/* =========================
   PRICE
========================= */

function formatPrice(price) {

  return Number(price)
    .toLocaleString("fr-DZ")
    + " دج";

}



/* =========================
   ESCAPE
========================= */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;

}



/* =========================
   TOAST
========================= */

let toastTimer;


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList
    .add("show");


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList
          .remove("show");

      },
      2500
    );

}



/* =========================
   CLOSE MODAL OUTSIDE
========================= */

document
  .getElementById("sellModal")
  .addEventListener(
    "click",
    function(event) {

      if(
        event.target ===
        this
      ) {

        closeSell();

      }

    }
  );



/* =========================
   START
========================= */

loadProducts();
